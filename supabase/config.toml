# Supabase project configuration for DismissFlow EPS (Tulip-first backend).
# Source of truth: Docs/architecture.md §5, §6, §16. No separate backend.
# Execution target: `supabase` CLI (`supabase db push` / `supabase migration up`).
# Secrets are NEVER committed; only NEXT_PUBLIC_* and SUPABASE_SERVICE_ROLE_KEY
# are referenced via environment (see .env.example).

project_id = "dismissflow-eps"

[api]
enabled = true
port = 54321
schemes = ["http", "https"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
require_verification = false

[auth.phone]
enable_signup = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
