<script>
  document.addEventListener('DOMContentLoaded', () => {
    const requestBtn = document.getElementById('request-btn');
    const qrSection = document.getElementById('qr-section');
    const countdownEl = document.getElementById('countdown');
    
    let timeLeft = 102; // 1:42 in seconds
    let timerId;

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (timeLeft > 0) {
        timeLeft--;
      } else {
        clearInterval(timerId);
        countdownEl.classList.add('text-error');
      }
    }

    requestBtn.addEventListener('click', () => {
      // Hide button
      requestBtn.classList.add('hidden');
      
      // Show QR section
      qrSection.classList.remove('hidden');
      
      // Trigger animation after a tiny delay for DOM to register 'flex' instead of 'hidden'
      setTimeout(() => {
        qrSection.classList.remove('opacity-0', 'scale-95');
        qrSection.classList.add('opacity-100', 'scale-100');
      }, 50);

      // Start countdown
      timerId = setInterval(updateTimer, 1000);
    });
  });
